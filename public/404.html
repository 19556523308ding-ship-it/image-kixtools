<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 — Page Not Found | Jin Image Tools</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-512x512.png" sizes="512x512" />
    <meta name="theme-color" content="#2b5ae8" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.25rem;
        background: #f7f9fc;
        color: #1c2430;
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        line-height: 1.6;
      }
      .card { max-width: 34rem; width: 100%; text-align: center; }
      .code {
        display: inline-flex; align-items: center; justify-content: center;
        width: 4rem; height: 4rem; border-radius: 1rem; margin-bottom: 1.25rem;
        background: linear-gradient(135deg, #4578f5, #1fa596);
        color: #fff; font-size: 2.25rem; font-weight: 700; letter-spacing: -0.05em;
        box-shadow: 0 8px 24px rgba(69, 120, 245, 0.28);
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.5rem; font-weight: 700; }
      p { margin: 0 0 1.5rem; color: #5b6779; }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
      a {
        display: inline-flex; align-items: center; gap: 0.375rem;
        padding: 0.625rem 1.125rem; border-radius: 0.625rem;
        font-size: 0.9375rem; font-weight: 600; text-decoration: none;
      }
      .primary { background: #4578f5; color: #fff; }
      .primary:hover { background: #2b5ae8; }
      .ghost { border: 1px solid #dfe4ec; background: #fff; color: #1c2430; }
      .ghost:hover { border-color: #4578f5; color: #4578f5; }
      .zh { margin-top: 1.25rem; font-size: 0.9375rem; color: #5b6779; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>
        The page you're looking for doesn't exist or has moved.<br />
        Everything else on this site works: compress and convert images right in your browser.
      </p>
      <div class="actions">
        <a class="primary" href="/zh-CN/">图片压缩工具</a>
        <a class="ghost" href="/blog/">Read the blog</a>
      </div>
      <p class="zh">你访问的页面不存在或已移动。本站无需上传，可直接在浏览器里压缩与转换图片。</p>
    </div>
  </body>
</html>
